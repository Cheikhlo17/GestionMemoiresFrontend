<!-- src/app/features/admin/pages/users/users.component.html -->
<div class="users-page">
  <mat-card class="filter-card">
    <form [formGroup]="filterForm">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Rechercher</mat-label>
        <input matInput formControlName="search" placeholder="Nom ou e-mail" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </form>
  </mat-card>

  <mat-card class="table-card">
    <table mat-table [dataSource]="users()">
      <ng-container matColumnDef="full_name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let u">{{ u.full_name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>E-mail</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rôle</th>
        <td mat-cell *matCellDef="let u">{{ u.role?.name }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let u">
          <span class="status-dot" [class.status-dot--inactive]="!u.is_active"></span>
          {{ u.is_active ? 'Actif' : 'Inactif' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let u">
          <button mat-button [color]="u.is_active ? 'warn' : 'primary'" (click)="toggleActive(u)">
            {{ u.is_active ? 'Désactiver' : 'Activer' }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="totalItems()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 15, 25, 50]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </mat-card>
</div>

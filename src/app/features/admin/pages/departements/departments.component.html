<div class="departments-page">
  <mat-card class="form-card">
    <h2>{{ editingId() ? 'Modifier le département' : 'Nouveau département' }}</h2>
    <form [formGroup]="form" (ngSubmit)="submit()" class="inline-form">
      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" />
      </mat-form-field>

      <mat-checkbox formControlName="is_active">Actif</mat-checkbox>

      <div class="inline-form__actions">
        @if (editingId()) {
          <button mat-button type="button" (click)="cancelEdit()">Annuler</button>
        }
        <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
          {{ editingId() ? 'Enregistrer' : 'Créer' }}
        </button>
      </div>
    </form>
  </mat-card>

  <mat-card class="table-card">
    <table mat-table [dataSource]="departments()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let d">{{ d.name }}</td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let d">{{ d.code }}</td>
      </ng-container>

      <ng-container matColumnDef="programs">
        <th mat-header-cell *matHeaderCellDef>Formations</th>
        <td mat-cell *matCellDef="let d">{{ d.programs_count }}</td>
      </ng-container>

      <ng-container matColumnDef="students">
        <th mat-header-cell *matHeaderCellDef>Étudiants</th>
        <td mat-cell *matCellDef="let d">{{ d.students_count }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let d">
          <span class="status-dot" [class.status-dot--inactive]="!d.is_active"></span>
          {{ d.is_active ? 'Actif' : 'Inactif' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let d">
          <button mat-icon-button (click)="edit(d)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="remove(d)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>
</div>

<h2 mat-dialog-title>Modifier le statut du mémoire</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="status-form">
    <mat-form-field appearance="outline">
      <mat-label>Nouveau statut</mat-label>
      <mat-select formControlName="status">
        @for (status of data.allowedStatuses; track status) {
          <mat-option [value]="status">{{ status | uiLabel }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Remarques (facultatif)</mat-label>
      <textarea matInput rows="3" formControlName="remarks" placeholder="Remarques"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-flat-button color="primary" (click)="submit()">Mettre à jour</button>
</mat-dialog-actions>
